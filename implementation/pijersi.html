<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="./pijersi.css">
	<title>pijersi</title>
</head>

<body id="pijersi_body" onload="pijersi_init();">

	<div id="pijersi_grid_container">

		<div id="pijersi_credit" onclick="pijersi_increment_credit()"></div>

		<span id="pijersi_title"></span>
		
		<div id="pijersi_menu">

			<div id="pijersi_hamburger" onclick="pijersi_click_menu()"></div>

			<div id="pijersi_menu_items">

				<div id="pijersi_new" class="pijersi_menu_item_class" onclick="pijersi_new()">New</div>
				<div id="pijersi_stop" class="pijersi_menu_item_class" onclick="pijersi_stop()">Stop</div>
				<div id="pijersi_resume" class="pijersi_menu_item_class" onclick="pijersi_resume()">Resume</div>
				<div id="pijersi_edit" class="pijersi_menu_item_class" onclick="pijersi_edit()">Edit</div>

				<hr class="pijersi_menu_line_class">
				<div class="pijersi_menu_separator_class">Show :</div>

				<div class="pijersi_menu_item_class">
					<input id="pijersi_show_captures" class="pijersi_checkbox_class" type="checkbox" checked="checked" 
					onclick="pijersi_show_captures()">
					<span onclick="pijersi_toggle_checkbox('pijersi_show_captures')">Captures</span>
				</div>
				
				<div class="pijersi_menu_item_class">
					<input id="pijersi_show_labels" class="pijersi_checkbox_class" type="checkbox" checked="checked"
					onclick="pijersi_show_labels()">
					<span onclick="pijersi_toggle_checkbox('pijersi_show_labels')">Labels</span>
				</div>

			</div>
		</div>

		<div id="pijersi_board" onclick="pijersi_play()"></div>

		<div id="pijersi_white_turn" onclick="pijersi_white_turn()"></div>
		
		<div id="pijersi_previous" ></div>

		<span id="pijersi_legend"></span>

		<div id="pijersi_next" ></div>

	    <div id="pijersi_black_turn" onclick="pijersi_black_turn()"></div>
	</div>		

	<script>
		"use strict";
		
		var pijersi_menu_showed = false;

		const PIJERSI_MENU_ITEMS = document.getElementById("pijersi_menu_items");

		const PIJERSI_MODE_RUNNING = "running";
		const PIJERSI_MODE_REVIEWING = "reviewing";
		const PIJERSI_MODE_EDITING = "editing";
		var pijersi_mode = PIJERSI_MODE_RUNNING;

		const PIJERSI_TITLE = document.getElementById("pijersi_title");	
		const PIJERSI_LEGEND = document.getElementById("pijersi_legend");	
	
		const PIJERSI_CREDIT = document.getElementById("pijersi_credit");
		const PIJERSI_CREDIT_MAX = 20;
		var pijersi_credit_value = PIJERSI_CREDIT_MAX;

		const PIJERSI_PLAYER_WHITE = "white";
		const PIJERSI_PLAYER_BLACK = "black";
		var pijersi_player = PIJERSI_PLAYER_WHITE;

		const PIJERSI_BLACK_TURN = document.getElementById("pijersi_black_turn");
		const PIJERSI_WHITE_TURN = document.getElementById("pijersi_white_turn");

		var pijersi_turns = undefined;
		var pijersi_current_turn = undefined;


		const pijersi_init = function(){
			pijersi_new();
		};


		const pijersi_set_mode = function(mode){
			if ( mode === PIJERSI_MODE_RUNNING || mode === PIJERSI_MODE_REVIEWING || mode === PIJERSI_MODE_EDITING ) {
		 		
				pijersi_mode = mode;
				pijersi_update_title();

				if ( mode === PIJERSI_MODE_EDITING ) {
					PIJERSI_WHITE_TURN.classList.add("pijersi_turn_edit");
					PIJERSI_BLACK_TURN.classList.add("pijersi_turn_edit");
					PIJERSI_CREDIT.classList.add("pijersi_credit_edit");

				} else {
					PIJERSI_WHITE_TURN.classList.remove("pijersi_turn_edit");
					PIJERSI_BLACK_TURN.classList.remove("pijersi_turn_edit");
					PIJERSI_CREDIT.classList.remove("pijersi_credit_edit");
				}
			}
		};


		const pijersi_update_title = function(){
			PIJERSI_TITLE.innerHTML = "Pijersi [" + pijersi_mode + "]";
		};


		const pijersi_update_legend = function(legend){
			PIJERSI_LEGEND.innerHTML = legend;
		};


		const pijersi_update_credit = function(){
			PIJERSI_CREDIT.innerHTML = pijersi_credit_value.toString().padStart(2, '0');
		};

		
		const pijersi_increment_credit = function(){
			pijersi_credit_value = pijersi_credit_value + 1;
			if ( pijersi_credit_value > PIJERSI_CREDIT_MAX ) pijersi_credit_value = 0;
			pijersi_update_credit()					
		};

		
		const pijersi_decrement_credit = function(){
			pijersi_credit_value = pijersi_credit_value - 1;
			if ( pijersi_credit_value < 0 ) pijersi_credit_value = 0;
			pijersi_update_credit()					
		};

		
		const pijersi_reset_credit = function(){
			pijersi_credit_value = PIJERSI_CREDIT_MAX;
			pijersi_update_credit()					
		};


		const pijersi_set_player = function(player){
			if ( player === PIJERSI_PLAYER_WHITE || player === PIJERSI_PLAYER_BLACK ) {
				pijersi_player = player
			}

			if ( pijersi_player === PIJERSI_PLAYER_WHITE ) {
				PIJERSI_BLACK_TURN.classList.remove("pijersi_black_turn_on");
				PIJERSI_WHITE_TURN.classList.add("pijersi_white_turn_on");

			} else if ( pijersi_player === PIJERSI_PLAYER_BLACK ) {
				PIJERSI_WHITE_TURN.classList.remove("pijersi_white_turn_on");
				PIJERSI_BLACK_TURN.classList.add("pijersi_black_turn_on");
			}
		};


		const pijersi_change_player = function(){
			if ( pijersi_player === PIJERSI_PLAYER_WHITE ) {
				pijersi_set_player(PIJERSI_PLAYER_BLACK);

			} else if ( pijersi_player === PIJERSI_PLAYER_BLACK ) {
				pijersi_set_player(PIJERSI_PLAYER_WHITE);
			}
		};


		const pijersi_toggle_checkbox = function(checkbox_id){
			const checkbox = document.getElementById(checkbox_id);
			checkbox.click();
		};


		const pijersi_click_menu = function(){
			pijersi_menu_showed = ! pijersi_menu_showed;
			pijersi_show_menu(pijersi_menu_showed);
		};


		const pijersi_show_menu = function(condition){

			if ( condition !== true && condition !== false ) return ;

			pijersi_menu_showed = condition;

			if ( pijersi_menu_showed ) {
  				PIJERSI_MENU_ITEMS.classList.add("pijersi_show");

			} else {
  				PIJERSI_MENU_ITEMS.classList.remove("pijersi_show");
			}
		};


		const pijersi_new = function(){
			pijersi_show_menu(false);
			pijersi_set_mode(PIJERSI_MODE_RUNNING);
			pijersi_reset_credit();
			pijersi_set_player(PIJERSI_PLAYER_WHITE);

			pijersi_reset_turns();
			pijersi_update_legend(pijersi_turns[pijersi_current_turn]);
		};
				

		const pijersi_stop = function(){
			pijersi_show_menu(false);
			pijersi_set_mode(PIJERSI_MODE_REVIEWING);
		};
				

		const pijersi_resume = function(){
			pijersi_show_menu(false);
			if ( pijersi_credit_value !== 0 ) {
				pijersi_set_mode(PIJERSI_MODE_RUNNING);
				pijersi_update_legend(pijersi_turns[pijersi_current_turn]);
			}
		};
				

		const pijersi_edit = function(){
			pijersi_show_menu(false);
			pijersi_set_mode(PIJERSI_MODE_EDITING);

			pijersi_reset_turns();
			pijersi_update_legend(pijersi_turns[pijersi_current_turn]);
		};

		
		const pijersi_show_captures = function(){
			pijersi_show_menu(false);
		};

		
		const pijersi_show_labels = function(){
			pijersi_show_menu(false);
		};

	
		const pijersi_white_turn = function(){
			if ( pijersi_mode !== PIJERSI_MODE_EDITING ) return;
			pijersi_change_player();
		};
	

		const pijersi_black_turn = function(){
			if ( pijersi_mode !== PIJERSI_MODE_EDITING ) return;
			pijersi_change_player();
		};


		const pijersi_play = function(){
			if ( pijersi_mode !== PIJERSI_MODE_RUNNING ) return;

			pijersi_decrement_credit();					

			if ( pijersi_credit_value === 0 ) {
				pijersi_stop();

			} else {
				pijersi_new_turn();
				pijersi_change_player();
			}
		};
		

		const pijersi_reset_turns = function(){
			pijersi_current_turn = 0;
			pijersi_turns = []
			pijersi_turns.push("");
		};
		

		const pijersi_new_turn = function(){
			pijersi_current_turn += 1;
			const new_legend = pijersi_current_turn.toString() + " " + "xi-yi=zk"
			pijersi_turns.push(new_legend);

			pijersi_update_legend(new_legend);
		};

	</script>

</body>
</html>
