	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>pijersi</title>
</head>

<body id="pijersi_body">
	<div id="pijersi_grid_container">

		<img src="img/black-chrono.svg" alt="pijersi" id="pijersi_black_turn">
		
		<span id="pijersi_title"></span>
		
		<div id="pijersi_menu">

			<img id="pijersi_hamburger" src="img/hamburger.svg" alt="pijersi" >

			<div id="pijersi_menu_items">

				<div id="pijersi_menu_new" class="pijersi_menu_item_class" onclick="pijersi_do_action('New')">New</div>
				<div id="pijersi_menu_stop" class="pijersi_menu_item_class" onclick="pijersi_do_action('Stop')">Stop</div>
				<div id="pijersi_menu_resume" class="pijersi_menu_item_class" onclick="pijersi_do_action('Resume')">Resume</div>
				<div id="pijersi_menu_edit" class="pijersi_menu_item_class" onclick="pijersi_do_action('Edit')">Edit</div>

				<hr class="pijersi_menu_line_class">
				<div class="pijersi_menu_separator_class">Show :</div>

				<div class="pijersi_menu_item_class">
					<input id="pijersi_show_captures" class="pijersi_checkbox_class" type="checkbox" checked="checked">
					<span onclick="pijersi_toggle_checkbox('pijersi_show_captures')">Captures</span>
				</div>
				
				<div class="pijersi_menu_item_class">
					<input id="pijersi_show_labels" class="pijersi_checkbox_class" type="checkbox" checked="checked">
					<span onclick="pijersi_toggle_checkbox('pijersi_show_labels')">Labels</span>
				</div>

			</div>
		</div>

		<img src="img/board.svg" alt="pijersi" id="pijersi_board">

		<img src="img/white-chrono.svg" alt="pijersi" id="pijersi_white_turn">

		<div id="pijersi_credit" onclick="pijersi_increment_credit()"></div>
	</div>		

	<script>
		var pijersi_mode = "running";

		const pijersi_title = document.getElementById("pijersi_title");	
		pijersi_title.innerHTML = "Pijersi [" + pijersi_mode + "]";
	
		const pijersi_credit = document.getElementById("pijersi_credit");
		const pijersi_credit_max = 20;
		var pijersi_credit_value = pijersi_credit_max;
		pijersi_credit.innerHTML = pijersi_credit_value.toString().padStart(2, '0');


		pijersi_toggle_checkbox = function(checkbox_id){
			const checkbox = document.getElementById(checkbox_id);
			checkbox.checked = ! checkbox.checked ;
		};

		
		pijersi_increment_credit = function(){
			if ( pijersi_mode === "editing" ) {

				pijersi_credit_value = pijersi_credit_value + 1;

				if (pijersi_credit_value >= pijersi_credit_max) pijersi_credit_value = 0;
				
				pijersi_credit.innerHTML = pijersi_credit_value.toString().padStart(2, '0');
			}
		};

		
		pijersi_do_action = function(action_name){
			console.log("pijersi_do_action: action_name = '" + action_name + "'");

			switch(action_name) {

  				case 'New':
					pijersi_mode = "running";
    				break;

  				case 'Stop':
					pijersi_mode = "reviewing";
    				break;

  				case 'Resume':
					pijersi_mode = "running";
    				break;

  				case 'Edit':
 					pijersi_mode = "editing";
   				break;

  				default:
					console.log("pijersi_do_action: unknown action_name = '" + action_name + "'");
			}

			pijersi_title.innerHTML = "Pijersi [" + pijersi_mode + "]";

		};



	</script>

</body>
</html>
