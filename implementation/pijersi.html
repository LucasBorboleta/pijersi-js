</head>

<body id="pijersi-view-body-id" onload="pijersi.__init(); pijersi.presenter.new_game();">

	<div id="pijersi-view-grid-container-id">

		<div id="pijersi-view-credit-id" onclick="pijersi.presenter.increment_credit()"></div>

		<span id="pijersi-view-title-id"></span>
		
		<div id="pijersi-view-menu-id">

			<div id="pijersi-view-menu-button-id" onclick="pijersi.view.toggle_menu()"></div>

			<div id="pijersi-view-menu-items-id">

				<div id="pijersi-view-new-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.new_game()">New</div>
				<div id="pijersi-view-stop-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.stop_game()">Stop/Review</div>
				<div id="pijersi-view-resume-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.resume_game()">Resume</div>
				<div id="pijersi-view-edit-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.edit_game()">Edit</div>

				<hr class="pijersi-view-menu-line-style">
				<div class="pijersi-view-menu-separator-style">Show :</div>

				<div class="pijersi-view-menu-item-style">
					<input id="pijersi-view-show-captures-id" class="pijersi-view-checkbox-style" type="checkbox" checked="checked" 
					onclick="pijersi.presenter.show_captures()">
					<span onclick="pijersi.view.toggle_checkbox('pijersi-view-show-captures-id')">Captures</span>
				</div>
				
				<div class="pijersi-view-menu-item-style">
					<input id="pijersi-view-show-labels-id" class="pijersi-view-checkbox-style" type="checkbox" checked="checked"
					onclick="pijersi.presenter.show_labels()">
					<span onclick="pijersi.view.toggle_checkbox('pijersi-view-show-labels-id')">Labels</span>
				</div>

			</div>
		</div>

		<div id="pijersi-view-board-id" onclick="pijersi.presenter.play_game()"></div>

		<div id="pijersi-view-white-turn-id" onclick="pijersi.presenter.toggle_player_turn()"></div>
		
		<div id="pijersi-view-show-previous-turn-id" onclick="pijersi.presenter.show_previous_turn()" ></div>

		<span id="pijersi-view-legend-id"></span>

		<div id="pijersi-view-show-next-turn-id"  onclick="pijersi.presenter.show_next_turn()"></div>

	    <div id="pijersi-view-black-turn-id" onclick="pijersi.presenter.toggle_player_turn()"></div>
	</div>		

	<script src="./pijersi.js"></script>
	<script src="./pijersi_debug.js"></script>
	<script src="./pijersi_model.js"></script>
	<script src="./pijersi_view.js"></script>
	<script src="./pijersi_presenter.js"></script>

</body>
</html>
