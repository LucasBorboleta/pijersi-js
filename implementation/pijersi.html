<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="./pijersi.css">
	<title>pijersi</title>
</head>

<body id="pijersi_body">
	<div id="pijersi_grid_container">

		<img src="img/black-chrono.svg" alt="pijersi" id="pijersi_black_turn">
		
		<span id="pijersi_title"><b>Pijersi</b> [running]</span>
		
		<div id="pijersi_menu">
			<img src="img/hamburger.svg" alt="pijersi" >
			<div id="pijersi_menu_items">
				<div id="pijersi_menu_new" class="pijersi_menu_item_class">New</div>
				<div id="pijersi_menu_stop" class="pijersi_menu_item_class">Stop</div>
				<div id="pijersi_menu_resume" class="pijersi_menu_item_class">Resume</div>
				<div id="pijersi_menu_edit" class="pijersi_menu_item_class">Edit</div>
				<hr class="pijersi_menu_line_class">
				<div class="pijersi_menu_separator_class">Show :</div>
				<div class="pijersi_menu_item_class"><input id="pijersi_show_captures" type="checkbox" checked="checked">
					<span>Captures</span>
				</div>
				<div class="pijersi_menu_item_class"><input id="pijersi_show_labels" type="checkbox" checked="checked">
					<span>Labels</span>
				</div>

			</div>
		</div>

		<img src="img/board.svg" alt="pijersi" id="pijersi_board">

		<img src="img/white-chrono.svg" alt="pijersi" id="pijersi_white_turn">

		<div id="pijersi_credit">
			<img src="img/minus.svg" alt="pijersi" id="pijersi_credit_decrement">
			<div id="pijersi_credit_value">20</div>
			<img src="img/plus.svg" alt="pijersi" id="pijersi_credit_increment">

		</div>

	</div>		

</body>
</html>
