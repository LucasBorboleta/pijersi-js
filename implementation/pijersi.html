<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="./pijersi.css">
	<title>pijersi</title>
</head>

<body id="pijersi-view-body-id" onload="pijersi.__init();" >

	<div id="pijersi-view-body-grid-id">

		<div id="pijersi-view-mouse-debug-id">(x,y) = (???, ???)</div>
		<div id="pijersi-view-other-debug-id">other debug</div>
		
		<div id="pijersi-view-menu-id">

			<div id="pijersi-view-menu-button-id" onclick="pijersi.view.toggle_menu()"></div>

			<div id="pijersi-view-menu-items-id">

				<div id="pijersi-view-new-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.new_game()">New</div>
				<div id="pijersi-view-stop-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.stop_review_game()">Stop/Review</div>
				<div id="pijersi-view-resume-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.resume_game()">Resume</div>
				<div id="pijersi-view-edit-game-id" class="pijersi-view-menu-item-style" onclick="pijersi.presenter.edit_game()">Edit</div>

				<hr class="pijersi-view-menu-line-style">
				<div class="pijersi-view-menu-separator-style">Show :</div>

				<div class="pijersi-view-menu-item-style">
					<input id="pijersi-view-show-captures-id" class="pijersi-view-checkbox-style" type="checkbox" onclick="pijersi.presenter.toggle_captures()">
					<span onclick="pijersi.view.toggle_checkbox('pijersi-view-show-captures-id')">Captures</span>
				</div>
				
				<div class="pijersi-view-menu-item-style">
					<input id="pijersi-view-show-labels-id" class="pijersi-view-checkbox-style" type="checkbox" onclick="pijersi.presenter.toggle_labels()">
					<span onclick="pijersi.view.toggle_checkbox('pijersi-view-show-labels-id')">Labels</span>
				</div>

			</div>
		</div>

		<div id="pijersi-view-board-id" onclick="pijersi.presenter.play_game()"></div>

		<div id="pijersi-view-title-id"></div>
		<div id="pijersi-view-legend-id"></div>
		<div id="pijersi-view-credit-id" onclick="pijersi.presenter.edit_credit()"></div>

		<div id="pijersi-view-white-turn-id" onclick="pijersi.presenter.edit_player_turn()"></div>
		<div id="pijersi-view-black-turn-id" onclick="pijersi.presenter.edit_player_turn()"></div>

		<!-- "multi-func buttons" allows compact layout ; see also CSS at "#pijersi-view-body-grid-id" :
				- "left-multi-func-button" triggers either "show_previous_turn()" or "swap_blacks()" ;
				- "left-multi-func-button" triggers either "show_next_turn()" or "swap_whites()" ;
				- the redirections of "multi_func buttons" are managed in "pijersi.view".
		-->
		<div id="pijersi-view-left-multi-func-button-id" onclick="pijersi.view.click_left_multi_func()"></div>
		<div id="pijersi-view-right-multi-func-button-id" onclick="pijersi.view.click_right_multi_func()"></div>

		<div id="pijersi-view-captures-id">
			<div id="pijersi-view-captures-grid-id">

				<div id="pijersi-view-capture-blacks-id">
					<div id="pijersi-view-capture-blacks-grid-id">

						<div id="pijersi-view-capture-black-rocks-id">
							<div id="pijersi-view-capture-black-rocks-grid-id">
								<div id="pijersi-view-capture-black-rock-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-rock-2-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-rock-3-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-rock-4-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

						<div id="pijersi-view-capture-black-papers-id">
							<div id="pijersi-view-capture-black-papers-grid-id">
								<div id="pijersi-view-capture-black-paper-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-paper-2-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-paper-3-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-paper-4-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

						<div id="pijersi-view-capture-black-scissors-id">
							<div id="pijersi-view-capture-black-scissors-grid-id">
								<div id="pijersi-view-capture-black-scissors-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-scissors-2-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-scissors-3-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-scissors-4-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

						<div id="pijersi-view-capture-black-wises-id">
							<div id="pijersi-view-capture-black-wises-grid-id">
								<div id="pijersi-view-capture-black-wise-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-black-wise-2-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

					</div>
				</div>

				<div id="pijersi-view-capture-whites-id">
					<div id="pijersi-view-capture-whites-grid-id">

						<div id="pijersi-view-capture-white-rocks-id">
							<div id="pijersi-view-capture-white-rocks-grid-id">
								<div id="pijersi-view-capture-white-rock-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-rock-2-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-rock-3-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-rock-4-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

						<div id="pijersi-view-capture-white-papers-id">
							<div id="pijersi-view-capture-white-papers-grid-id">
								<div id="pijersi-view-capture-white-paper-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-paper-2-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-paper-3-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-paper-4-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

						<div id="pijersi-view-capture-white-scissors-id">
							<div id="pijersi-view-capture-white-scissors-grid-id">
								<div id="pijersi-view-capture-white-scissors-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-scissors-2-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-scissors-3-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-scissors-4-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

						<div id="pijersi-view-capture-white-wises-id">
							<div id="pijersi-view-capture-white-wises-grid-id">
								<div id="pijersi-view-capture-white-wise-1-id" class="pijersi-view-capture-cube-style"></div>
								<div id="pijersi-view-capture-white-wise-2-id" class="pijersi-view-capture-cube-style"></div>
							</div>
						</div>

					</div>
				</div>

			</div>
		</div>
	</div>		

	<script src="./pijersi.js"></script>
	<script src="./pijersi_debug.js"></script>
	<script src="./pijersi_math.js"></script>
	<script src="./pijersi_model.js"></script>
	<script src="./pijersi_view.js"></script>
	<script src="./pijersi_presenter.js"></script>

</body>
</html>
